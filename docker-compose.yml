services:
  # Aplikasi Backend Node.js
  app:
    build: .
    image: muchamadfaruq/simapeldwisma:latest
    container_name: mapel-app-2
    restart: always
    # Port publik dihapus agar aman
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-ganti-dengan-secret-yang-kuat}
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/data:/app/backend/data
      - ./img:/app/img
    networks:
      - nginx-proxy-manager_default

networks:
  nginx-proxy-manager_default:
    external: true
