services:
  app:
    build: .
#    image: muchamadfaruq/simapeldwisma:latest
    container_name: mapel-app-1
    restart: always
    ports:
      - "3112:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-ganti-dengan-secret-yang-kuat}
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/data:/app/backend/data
      - ./img:/app/img
    networks:
      - app-net

networks:
  app-net:
    name: mapeldwisma_default
